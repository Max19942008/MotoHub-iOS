# XcodeGen spec — run `xcodegen generate` to create MotoHub.xcodeproj (the project file is not committed).
name: MotoHub
options:
  bundleIdPrefix: online.motopresto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"

targets:
  MotoHub:
    type: application
    platform: iOS
    sources:
      - path: MotoHub
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MOTOPRESTO
        # The site's font (Resources/Fonts) and look: light only, like the website.
        UIAppFonts:
          - Poppins-Regular.ttf
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Poppins-ExtraBold.ttf
        UIUserInterfaceStyle: Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Backend + website; override per configuration with the API_BASE_URL / SITE_URL build settings.
        MHAPIBaseURL: $(API_BASE_URL)
        MHSiteURL: $(SITE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.motopresto.app
        PRODUCT_NAME: MotoHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        API_BASE_URL: https://api.motopresto.online
        SITE_URL: https://motopresto.online

  MotoHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MotoHubTests
    dependencies:
      - target: MotoHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: online.motopresto.app.tests

  # Screenshot walk-through against the live backend (CI: .github/workflows/screenshots.yml).
  MotoHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MotoHubUITests
    dependencies:
      - target: MotoHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: online.motopresto.app.uitests

schemes:
  MotoHubScreenshots:
    build:
      targets:
        MotoHub: all
        MotoHubUITests: [test]
    test:
      targets:
        - MotoHubUITests

  MotoHub:
    build:
      targets:
        MotoHub: all
        MotoHubTests: [test]
    test:
      targets:
        - MotoHubTests
